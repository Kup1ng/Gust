# Gust host tuning. Install as /etc/sysctl.d/99-gust.conf, then:
#   sudo sysctl --system
#
# Values are sized for a small box (2 vCPU / 2 GB RAM) pushing ~2 Gbit/s.
# See docs/tuning.md for the reasoning and the capacity math.

# --- file descriptors (userspace mode uses 2 fds per connection) ---
fs.file-max = 2097152
fs.nr_open  = 2097152

# --- listen/accept backlog ---
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# --- ephemeral ports (outbound dials + NAT masquerade) ---
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_tw_reuse = 1

# --- socket buffers: low min/default keeps idle conns cheap, capped max ---
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
net.ipv4.tcp_rmem = 4096 16384 4194304
net.ipv4.tcp_wmem = 4096 16384 4194304

# --- conntrack (NAT mode only) ---
net.netfilter.nf_conntrack_max = 524288
net.netfilter.nf_conntrack_tcp_timeout_established = 86400

# --- forwarding (NAT mode only) ---
net.ipv4.ip_forward = 1
# net.ipv6.conf.all.forwarding = 1   # only if you forward IPv6
