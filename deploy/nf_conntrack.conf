# Conntrack hash table sizing for NAT mode. Install as
# /etc/modprobe.d/nf_conntrack.conf and reboot (or reload the module).
#
# Rule of thumb: buckets ~= nf_conntrack_max / 2. With max=524288 this gives
# ~262144 buckets (~2 MiB of pointers). 300k tracked connections cost roughly
# 100 MiB of conntrack entries (~320 B each) — comfortable on a 2 GB box.

options nf_conntrack hashsize=262144
